name: Build OrangeFox Recovery for Realme C25Y (RMX3269)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Branch (12.1)'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'

jobs:
  build:
    name: Build OrangeFox
    runs-on: ubuntu-22.04

    env:
      DEVICE: RMX3269
      DEVICE_PATH: device/realme/RMX3269
      OF_MAINTAINER: "visEXE"
      FOX_MAINTAINER_PATCH_VERSION: 2

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: ${{ env.DEVICE_PATH }}

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker rmi $(docker images -q) 2>/dev/null || true
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf gcc-multilib g++-multilib libc6-dev-i386 \
          libxml2-utils xsltproc fontconfig openjdk-8-jdk \
          python3 python-is-python3 git curl rsync libssl-dev \
          bc bison flex zip unzip tar ccache libncurses5-dev
        sudo update-java-alternatives -s java-1.8.0-openjdk-amd64 || true

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Configure Git
      run: |
        git config --global user.name "visEXE"
        git config --global user.email "visEXE@local"

    - name: Sync OrangeFox Sources using Official Script
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git ~/sync
        cd ~/sync
        ./orangefox_sync.sh --branch ${{ inputs.FOX_BRANCH }} --path ~/fox_work

    - name: Copy Device Tree into Workspace
      run: |
        mkdir -p ~/fox_work/${{ env.DEVICE_PATH }}
        cp -r $GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}/* ~/fox_work/${{ env.DEVICE_PATH }}/
        rm -rf $GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}

    - name: Apply DRM Fix
      run: |
        echo "Searching for graphics_drm.cpp..."
        DRM_FILES=$(find ~/fox_work/bootable -name "graphics_drm.cpp")
        if [ -z "$DRM_FILES" ]; then
          echo "Warning: graphics_drm.cpp not found under bootable!"
        else
          for f in $DRM_FILES; do
            echo "Replacing $f with patched graphics_drm.cpp..."
            cp ~/fox_work/${{ env.DEVICE_PATH }}/patches/graphics_drm.cpp "$f"
          done
        fi

    - name: Build OrangeFox Recovery
      run: |
        set -x
        cd ~/fox_work
        # Remove obsolete vendorsetup.sh if present
        rm -f ${{ env.DEVICE_PATH }}/vendorsetup.sh
        # Fix rsync conflict where root/vendor symlink conflicts with recovery/root/vendor directory
        grep -rl "rsync -a --exclude=sdcard" build/ | while read -r f; do
            sed -i 's/rsync -a --exclude=sdcard/rsync -a --exclude=sdcard --exclude=\/root\/vendor --exclude=vendor --exclude=\/root\/product --exclude=product --exclude=\/root\/system_ext --exclude=system_ext --exclude=\/root\/odm --exclude=odm/g' "$f"
        done
        unset FOX_VERSION
        export OF_MAINTAINER="${{ env.OF_MAINTAINER }}"
        export FOX_MAINTAINER_PATCH_VERSION=2
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export TW_THEME="portrait_hdpi"
        export TARGET_SCREEN_WIDTH=720
        export TARGET_SCREEN_HEIGHT=1600
        export TW_SCREEN_WIDTH=720
        export TW_SCREEN_HEIGHT=1600
        set +e
        source build/envsetup.sh
        lunch twrp_${{ env.DEVICE }}-eng || lunch twrp_${{ env.DEVICE }}-userdebug
        LUNCH_RET=$?
        set -e
        if [ $LUNCH_RET -ne 0 ]; then
            echo "Failed to select lunch target!"
            exit 1
        fi
        echo "Successfully selected target: $TARGET_PRODUCT for device $TARGET_DEVICE"
        mka bootimage -j$(nproc --all)

    - name: Check Output Files and Repack
      id: check_files
      run: |
        cd ~/fox_work
        OUT_DIR="out/target/product/${{ env.DEVICE }}"
        MKBOOTIMG="out/host/linux-x86/bin/mkbootimg"
        AVBTOOL="external/avb/avbtool"
        mkdir -p $GITHUB_WORKSPACE/output

        # Repack boot.img using exact Unisoc offsets and AVB footer if ramdisk exists
        if [ -f "$OUT_DIR/ramdisk-recovery.img" ] && [ -f "$MKBOOTIMG" ]; then
          echo "Creating AVB-signed manual boot.img..."
          $MKBOOTIMG \
            --kernel "${{ env.DEVICE_PATH }}/prebuilt/kernel" \
            --ramdisk "$OUT_DIR/ramdisk-recovery.img" \
            --cmdline "console=ttyS1,115200n8 androidboot.selinux=permissive twrpfastboot=1 buildvariant=eng" \
            --base 0x00000000 --pagesize 2048 \
            --dtb "${{ env.DEVICE_PATH }}/prebuilt/dtb.img" \
            --header_version 2 \
            --kernel_offset 0x00008000 --ramdisk_offset 0x05400000 \
            --tags_offset 0x00000100 --dtb_offset 0x01f00000 \
            --os_version 12 --os_patch_level 2022-04-05 \
            -o $GITHUB_WORKSPACE/output/boot_repack_avb.img || true

          if [ -f "$GITHUB_WORKSPACE/output/boot_repack_avb.img" ] && [ -f "$AVBTOOL" ]; then
            python3 $AVBTOOL add_hash_footer \
              --image $GITHUB_WORKSPACE/output/boot_repack_avb.img \
              --partition_size 67108864 \
              --partition_name boot \
              --algorithm NONE \
              --rollback_index 1 || true
          fi
        fi

        cd ~/fox_work/$OUT_DIR
        ls -la
        find . -maxdepth 2 -name "OrangeFox*.zip" -exec cp {} $GITHUB_WORKSPACE/output/ \;
        find . -maxdepth 2 -name "OrangeFox*.img" -exec cp {} $GITHUB_WORKSPACE/output/ \;
        find . -maxdepth 2 -name "boot.img" -exec cp {} $GITHUB_WORKSPACE/output/recovery-boot.img \;
        find . -maxdepth 2 -name "recovery.img" -exec cp {} $GITHUB_WORKSPACE/output/recovery.img \;
        
        # Download and run magiskboot repack for maximum bootloader compatibility
        curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -o /tmp/magisk.apk || true
        if unzip -p /tmp/magisk.apk lib/x86_64/libmagiskboot.so > /tmp/magiskboot 2>/dev/null; then
            chmod +x /tmp/magiskboot
            mkdir -p /tmp/repack && cd /tmp/repack
            cp $GITHUB_WORKSPACE/output/recovery-boot.img ./boot.img
            /tmp/magiskboot unpack ./boot.img || true
            /tmp/magiskboot repack ./boot.img $GITHUB_WORKSPACE/output/boot-magiskboot.img || true
        fi
        
        ls -la $GITHUB_WORKSPACE/output/

    - name: Upload OrangeFox Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-${{ env.DEVICE }}
        path: output/*
