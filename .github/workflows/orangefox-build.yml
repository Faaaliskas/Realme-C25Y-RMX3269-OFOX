name: Build OrangeFox Recovery for Realme C25Y (RMX3269)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Branch (12.1 is recommended for Android 11/12)'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'
        - '14.1'

jobs:
  build:
    name: Build OrangeFox
    runs-on: ubuntu-22.04

    env:
      DEVICE: RMX3269
      DEVICE_PATH: device/realme/RMX3269
      OF_MAINTAINER: "visEXE | KSN"
      FOX_MAINTAINER_PATCH_VERSION: 1

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: ${{ env.DEVICE_PATH }}

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker rmi $(docker images -q) 2>/dev/null || true
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf gcc-multilib g++-multilib libc6-dev-i386 \
          libxml2-utils xsltproc fontconfig openjdk-8-jdk \
          python3 python-is-python3 git curl rsync libssl-dev \
          bc bison flex zip unzip tar ccache libncurses5-dev
        sudo update-java-alternatives -s java-1.8.0-openjdk-amd64 || true

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Configure Git
      run: |
        git config --global user.name "visEXE-KSN"
        git config --global user.email "visEXE@local"

    - name: Sync OrangeFox Sources using Official Script
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git ~/sync
        cd ~/sync
        ./orangefox_sync.sh --branch ${{ inputs.FOX_BRANCH }} --path ~/work

    - name: Copy Device Tree into Workspace
      run: |
        mkdir -p ~/work/${{ env.DEVICE_PATH }}
        cp -r $GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}/* ~/work/${{ env.DEVICE_PATH }}/

    - name: Apply DRM Display Fix
      run: |
        cd ~/work
        if [ -f ${{ env.DEVICE_PATH }}/patches/graphics_drm.cpp ]; then
          echo "Applying DRM display patch to bootable/recovery/minui/graphics_drm.cpp..."
          cp -f ${{ env.DEVICE_PATH }}/patches/graphics_drm.cpp bootable/recovery/minui/graphics_drm.cpp
        fi

    - name: Build OrangeFox Recovery
      run: |
        set +e
        set -x
        cd ~/work
        # Remove obsolete vendorsetup.sh if present
        rm -f ${{ env.DEVICE_PATH }}/vendorsetup.sh
        unset FOX_VERSION
        export OF_MAINTAINER="${{ env.OF_MAINTAINER }}"
        export FOX_MAINTAINER_PATCH_VERSION=1
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        source build/envsetup.sh
        lunch twrp_${{ env.DEVICE }}-eng || lunch twrp_${{ env.DEVICE }}-userdebug
        mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Check Output Files
      id: check_files
      run: |
        cd ~/work/out/target/product/${{ env.DEVICE }}
        ls -la
        mkdir -p $GITHUB_WORKSPACE/output
        find . -maxdepth 2 -name "OrangeFox*.zip" -exec cp {} $GITHUB_WORKSPACE/output/ \;
        find . -maxdepth 2 -name "OrangeFox*.img" -exec cp {} $GITHUB_WORKSPACE/output/ \;
        find . -maxdepth 2 -name "boot.img" -exec cp {} $GITHUB_WORKSPACE/output/recovery-boot.img \;
        find . -maxdepth 2 -name "recovery.img" -exec cp {} $GITHUB_WORKSPACE/output/recovery.img \;
        ls -la $GITHUB_WORKSPACE/output/

    - name: Upload OrangeFox Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-${{ env.DEVICE }}
        path: output/*
